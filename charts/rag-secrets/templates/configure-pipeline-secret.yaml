apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-pipeline-secrets
spec:
  refreshInterval: 2m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-pipeline-secrets
    template:
      type: Opaque
      engineVersion: v2
      data:
        AWS_S3_ENDPOINT: '{{ `{{ .AWS_S3_ENDPOINT }}` }}'
        LLAMASTACK_BASE_URL: '{{ `{{ .LLAMASTACK_BASE_URL }}` }}'
        OGX_AI_BASE_URL: '{{ `{{ .OGX_AI_BASE_URL }}` }}'
        DS_PIPELINE_URL: '{{ `{{ .DS_PIPELINE_URL }}` }}'
        SOURCE: '{{ `{{ .SOURCE }}` }}'
        EMBEDDING_MODEL: '{{ `{{ .EMBEDDING_MODEL }}` }}'
        NAME: '{{ `{{ .NAME }}` }}'
        VERSION: '{{ `{{ .VERSION }}` }}'
  data:
  - secretKey: AWS_S3_ENDPOINT
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: AWS_S3_ENDPOINT
  - secretKey: LLAMASTACK_BASE_URL
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: LLAMASTACK_BASE_URL
  - secretKey: OGX_AI_BASE_URL
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: OGX_AI_BASE_URL
  - secretKey: DS_PIPELINE_URL
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: DS_PIPELINE_URL
  - secretKey: SOURCE
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: SOURCE
  - secretKey: EMBEDDING_MODEL
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: EMBEDDING_MODEL
  - secretKey: NAME
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: NAME
  - secretKey: VERSION
    remoteRef:
      key: secret/data/hub/configure-pipeline
      property: VERSION
